name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
env:
  # Optional release-signing secrets (see README). Without them the release APK is signed with the fixed debug key.
  KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
jobs:
  build:
    # pinned: "ubuntu-latest" is moving to Ubuntu 26, which can change the preinstalled Java / Android tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare release keystore
        if: env.KS_B64 != ''
        shell: bash
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build-debug.log
      - name: Build release APK (small and fast)
        id: release
        continue-on-error: true
        shell: bash
        run: gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build-release.log
      - name: Show build errors
        if: failure() || steps.release.outcome == 'failure'
        shell: bash
        run: |
          # short version as annotations, long version (with the lines that explain the cause) in the run summary
          cat build-*.log | grep -E '^e: |error:|What went wrong|Execution failed|AAPT|Could not|Missing class' -A1 | head -12 | while IFS= read -r l; do echo "::error::${l}"; done
          {
            echo "### Build errors (full detail)"
            echo '```'
            cat build-*.log | grep -E 'What went wrong|^e: |Caused by|Failed to apply plugin' -A14 | head -90
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: APK sizes
        if: always()
        shell: bash
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/apk/*/*.apk 2>/dev/null | awk '{print "- " $5/1048576 " MB  " $9}' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Wave-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: Publish APKs to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Wave latest build
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
